<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Transport Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { background: #1a252f; color: #fff; padding: 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 24px; }
        .status-badge { padding: 6px 12px; background: #2ecc71; border-radius: 20px; font-weight: bold; font-size: 14px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 20px; border-top: 4px solid #3498db; }
        .card.delayed { border-top-color: #e74c3c; }
        .card.completed { border-top-color: #95a5a6; }
        .card h3 { margin-top: 0; color: #2c3e50; }
        .metric { font-size: 14px; margin: 8px 0; color: #555; }
        .metric strong { color: #333; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚸 Enterprise Transport Management Console</h1>
            <div class="status-badge">SYSTEM ONLINE</div>
        </header>
        
        <h2>Live Active Route Monitoring</h2>
        <div class="grid" id="route-container">
            <!-- Data dynamically populated via API -->
        </div>
    </div>

    <script>
        // Dynamically fetch tracking telemetry from our Python Flask endpoint
        async function fetchRouteTelemetry() {
            try {
                const response = await fetch('/api/v1/transport/status');
                const result = await response.json();
                const container = document.getElementById('route-container');
                container.innerHTML = '';

                result.data.forEach(route => {
                    let statusClass = '';
                    if(route.status === 'Delayed') statusClass = 'delayed';
                    if(route.status === 'Completed') statusClass = 'completed';

                    container.innerHTML += 
                        <div class="card ">
                            <h3>Route ID: </h3>
                            <div class="metric"><strong>Driver:</strong> </div>
                            <div class="metric"><strong>Status:</strong> </div>
                            <div class="metric"><strong>Next Destination:</strong> </div>
                            <div class="metric"><strong>Onboard Capacity:</strong> </div>
                        </div>
                    ;
                });
            } catch (error) {
                console.error("Telemetry streaming interruption:", error);
            }
        }
        
        fetchRouteTelemetry();
        setInterval(fetchRouteTelemetry, 10000); // Poll tracking every 10 seconds
    </script>
</body>
</html>
